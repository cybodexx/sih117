services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aegis-web:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: aegis-api:latest
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - vault:/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - appnet
      - datanet
      - modelnet
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: aegis-worker:latest
    command: ["python", "-m", "arq", "backend.worker.tasks.WorkerSettings"]
    env_file: .env
    volumes:
      - vault:/data
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
      - datanet
      - modelnet
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MAX_LOADED_MODELS=1
    networks:
      - modelnet
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11434'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.7
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    networks:
      - datanet
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=aegis
      - POSTGRES_PASSWORD=aegis
      - POSTGRES_DB=aegis_wb
    networks:
      - datanet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_wb"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - datanet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sentinel:
    build:
      context: ./aegis-sentinel
      dockerfile: Dockerfile
    image: aegis-sentinel:latest
    ports:
      - "8001:8001"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - appnet
      - datanet
      - modelnet
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/sentinel/status').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama_models:
  qdrant_data:
  pg_data:
  redis_data:
  vault:

networks:
  appnet:
    driver: bridge
  datanet:
    driver: bridge
  modelnet:
    driver: bridge
